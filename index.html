<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>gzweb</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }

        canvas[hidden] { display: none; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="webgpu-status"
        style="position: absolute; top: 10px; right: 10px; color: white; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.5); padding: 5px;">
        Checking WebGPU Support...
    </div>
    <div id="bevy-status"
        style="position: absolute; top: 40px; right: 10px; color: white; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.5); padding: 5px;">
        Bevy Status: Waiting...
    </div>
    <canvas id="bevy-canvas"></canvas>
    <script type="module">
        import {selectBackend, failStartup} from './startup.mjs';
        const fail = error => failStartup(document, error?.message ?? String(error));
        window.addEventListener('error', event => fail(event.error ?? event.message));
        window.addEventListener('unhandledrejection', event => fail(event.reason));
        try {
            const backend = await selectBackend(navigator, () => document.createElement('canvas'));
            document.getElementById('webgpu-status').textContent = `Renderer: ${backend}`;
            const {default: init} = await import(`./target/wasm32-unknown-unknown/release/${backend}/gzweb.js`);
            await init();
        } catch (error) {
            if (!String(error?.message).startsWith('Using exceptions for control flow,')) fail(error);
        }
    </script>
</body>

</html>
