# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run by scripts/check.sh deny (pre-commit: licenses, bans, sources) and in CI
# (also advisories, which needs the network).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each ignore needs a reason and should be revisited on every Bevy upgrade
# (.agent/DESIGN.md "Conventions").
ignore = [
  # ruzstd decompression bomb (OOM). Fixed in 0.9.1, but bevy_image 0.20
  # requires ^0.8. Reachable only through zstd-compressed KTX2 textures from
  # the connected Gazebo server or Fuel. Drop when Bevy moves to >= 0.9.1.
  { id = "RUSTSEC-2026-0344", reason = "transitive via bevy_image 0.20; no compatible fix" },
  # Unmaintained, no known vulnerability; transitive via Bevy.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via bevy_text" },
  # webpki-roots 0.26.11 (required by tungstenite 0.26) is a shim that
  # re-exports webpki-roots 1.x, locked at the fixed 1.0.10, so its roots
  # are the fixed ones. Drop when tungstenite moves to webpki-roots 1.x.
  { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 shim re-exports the fixed 1.0.10" },
]

[licenses]
version = 2
# Permissive licences only; this project is Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Windows' clipboard, under arboard (Bevy's system_clipboard): BSL-1.0
# for these two crates only.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

[[licenses.clarify]]
crate = "gz-parity"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
# Bevy's tree has many duplicate versions (windows-sys, etc.); report, don't fail.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
