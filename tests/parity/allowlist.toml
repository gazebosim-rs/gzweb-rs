# Known, intentional differences between gzweb and gzweb-rs.
# Each entry needs a reason. See .agent/PARITY.md section 4.

[[allow]]
id = "gzweb-ignores-background"
path = "<scene>"
field = "scene.clear_color"
reason = """gzweb always clears to 0xb2b2b2 and ignores <scene><background>. gzweb-rs \
honours an explicit background (alpha > 0). PORT_PLAN.md section 2.5."""

[[allow]]
id = "gzweb-light-colour-ignored"
field = "light.color"
reason = """gzweb passes the gz.msgs.Color object to `new THREE.*Light(color)`, which \
three ignores, so every gzweb light is white. gzweb-rs uses the diffuse colour."""

[[allow]]
id = "gzweb-spot-penumbra-clamp"
field = "light.penumbra"
reason = """gzweb clamps the spot penumbra to >= 1 (and gets NaN when both angles are 0); \
three.js expects [0, 1]. gzweb-rs clamps to [0, 1]. PORT_PLAN.md section 2.5."""

[[allow]]
id = "gzweb-hides-grid"
path = "<scene>"
field = "scene.grid_visible"
reason = """gzweb always hides its grid. gzweb-rs shows Gazebo's grid when the scene's \
`grid` flag is set (every Harmonic world sets it), as the Gazebo GUI does."""

[[allow]]
id = "gzweb-sky-header-only"
path = "<scene>"
field = "scene.sky"
reason = """gzweb reads a sky cubemap only from the Sky header's `cubemap_uri`; gzweb-rs \
falls back to the Sky.cubemap_uri field Harmonic sets. PORT_PLAN.md section 2.5."""

[[allow]]
id = "gzweb-heightmap-empty"
path = "Heightmap Bowl/link/visual"
field = "geometry.*"
reason = """gzweb builds terrain only from heights in the message, which Gazebo never \
sends, so its heightmap has no vertices. gzweb-rs loads the heightmap image, as Gazebo \
does. PORT_PLAN.md section 2.5."""
