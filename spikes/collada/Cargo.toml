[package]
name = "collada_spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: do not join the gzweb-rs workspace.
[workspace]

[dependencies]
mesh-loader = { version = "0.1.13", default-features = false, features = ["collada"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bevy 0.18 sub-crates used by the conversion prototype (no renderer needed).
bevy_app = "0.18"
bevy_asset = "0.18"
bevy_color = "0.18"
bevy_image = "0.18"
bevy_math = "0.18"
bevy_mesh = "0.18"
bevy_pbr = "0.18"
bevy_reflect = "0.18"
bevy_render = "0.18"
bevy_tasks = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
