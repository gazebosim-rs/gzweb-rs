[package]
name = "gz-core"
version = "0.1.0"
edition = "2021"
description = "Platform- and renderer-independent core of gzweb-rs: websocket protocol, Gazebo scene rules, snapshots"
license = "Apache-2.0"

[dependencies]
gz-proto.workspace = true
prost.workspace = true
# Decoding a topic's message by its type name, as text (`echo`).
prost-reflect = { version = "0.14", features = ["text-format"] }
serde.workspace = true
serde_json.workspace = true
# SDFormat for the overlays (`sdf`); already in the tree through resvg.
roxmltree = "0.21"
# `native`: blocking websocket connect with wss:// (rustls + ring).
tungstenite = { version = "0.26", optional = true, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", optional = true, features = ["std"] }
webpki-roots = { version = "1", optional = true }

[features]
native = ["dep:tungstenite", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dev-dependencies]
rcgen = "0.13"

[lints]
workspace = true
