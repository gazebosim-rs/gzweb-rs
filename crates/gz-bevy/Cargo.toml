[package]
name = "gz-bevy"
version = "0.1.0"
edition = "2021"
description = "Bevy plugin that renders a live Gazebo simulation from the gz websocket server"
license = "Apache-2.0"

[dependencies]
gz-core.workspace = true
gz-collada.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { version = "0.20", features = ["webgpu", "webgl2", "dds", "jpeg", "tga"] }
async-channel = "2"
crossbeam-channel = "0.5"
tobj = { version = "4.0.5", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gz-core = { workspace = true, features = ["native"] }
# The local time a message came (on the web, `js_sys::Date`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tungstenite = "0.26"
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Location",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "Event",
    "CloseEvent",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "AbortController",
    "AbortSignal",
    "AddEventListenerOptions",
    "EventTarget",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "UiEvent",
    "WheelEvent",
    "Storage",
]

[lints]
workspace = true
