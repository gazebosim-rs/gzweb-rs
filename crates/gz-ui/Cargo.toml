[package]
name = "gz-ui"
version = "0.1.0"
edition = "2021"
description = "The Gazebo workbench UI for gzweb-rs: theme, icons, fonts and widgets (design/ui)"
license = "Apache-2.0"
# The embedded Geist fonts (assets/fonts) are OFL-1.1; see assets/fonts/OFL.txt.

[dependencies]
gz-bevy.workspace = true
gz-core.workspace = true
bevy = "0.20"
# AccessKit node types; the same version Bevy's bevy_a11y uses.
accesskit = { version = "0.24", default-features = false }
# The World menu's screenshot as a PNG (Bevy's image loading has it already).
png = "0.18"

[build-dependencies]
# Build time only: tokens.json → Rust, icons.json → icon atlas PNGs. None of
# these reach the binary or the wasm payload.
serde_json.workspace = true
resvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"
# Writes the atlases with straight (not premultiplied) alpha; tiny-skia's
# own PNG writer leaves transparent texels black.
png = "0.18"

[dev-dependencies]
serde_json.workspace = true
# Topic messages for the Topics panel's tests.
prost.workspace = true
# Camera frames for the Sensors panel's tests.
png = "0.18"

[lints]
workspace = true
