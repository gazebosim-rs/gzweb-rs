[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.dependencies]
gz-proto = { path = "crates/gz-proto" }
gz-core = { path = "crates/gz-core" }
gz-bevy = { path = "crates/gz-bevy" }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
